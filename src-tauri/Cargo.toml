[package]
name = "trae-buddy-keeper"
version = "0.1.5"
description = "TraeBuddy Keeper - TRAE & WorkBuddy 签到管理"
authors = ["you"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "trae_buddy_keeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
reqwest = { version = "0.12", features = ["json", "cookies"] }
rfd = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
dirs = "5"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
axum = "0.8"
open = "5"
urlencoding = "2"
p256 = { version = "0.13", features = ["pkcs8"] }
aes-gcm = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_UI_Shell"] }
notify-rust = "4.18"

[features]
custom-protocol = ["tauri/custom-protocol"]
