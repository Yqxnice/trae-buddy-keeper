name: Release

# 推送 v* 标签时触发：构建签名安装包并发布 GitHub Release（含 latest.json 更新清单）
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史：Release 说明由上一个标签到本次标签的提交记录生成
          fetch-depth: 0

      - name: 生成更新说明
        id: notes
        shell: bash
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE="${GITHUB_REF_NAME}"
          if [ -n "$PREV" ]; then RANGE="$PREV..${GITHUB_REF_NAME}"; fi
          {
            echo "body<<NOTES_EOF"
            # 有手写发布说明时优先使用；否则按提交记录生成
            if [ -s RELEASE_NOTES.md ]; then
              cat RELEASE_NOTES.md
              echo
            else
              echo "## 本版变更"
              echo
              git log --reverse --pretty=format:"- %s (%h)" "$RANGE"
              echo
            fi
            echo
            echo "请下载对应安装包，已安装旧版的用户也会通过应用内自动更新收到本次升级。"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        # 显式指定官方源：不依赖 runner 默认配置，也避免 lock 中残留的镜像地址影响安装
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: npm ci

      - name: 同步版本号（以标签为准）
        shell: bash
        # 四处都要改：前端包名、lock、Tauri 配置、Rust 包。只改 tauri.conf.json 会让
        # 发版产物与 package.json / Cargo.toml 的版本号长期漂移，且 npm ci 会读到旧 lock 版本。
        run: |
          VER="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const ver = process.argv[1];
            for (const f of ["package.json", "package-lock.json", "src-tauri/tauri.conf.json"]) {
              const doc = JSON.parse(fs.readFileSync(f, "utf8"));
              doc.version = ver;
              if (f === "package-lock.json") doc.packages[""].version = ver;
              fs.writeFileSync(f, JSON.stringify(doc, null, 2) + "\n");
            }
            const lock = "src-tauri/Cargo.lock";
            fs.writeFileSync(lock, fs.readFileSync(lock, "utf8").replace(
              /(name = "trae-buddy-keeper"\nversion = ")[^"]+(")/, `$1${ver}$2`));
          ' "$VER"
          sed -i "s/^version = \"[^\"]*\"/version = \"$VER\"/" src-tauri/Cargo.toml
          echo "版本号已同步为 $VER（package.json / package-lock.json / tauri.conf.json / Cargo.toml / Cargo.lock）"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包签名密钥：仓库 Settings → Secrets → Actions 中配置，
          # 值为本地 C:\Users\24782\.tauri\aimanager.key 文件的完整内容；
          # 密钥无密码，TAURI_SIGNING_PRIVATE_KEY_PASSWORD 留空即可
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TraeBuddy Keeper v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
